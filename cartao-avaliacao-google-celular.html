<style>
  /* Versao celular (9:16) do cartao de avaliacao no Google. Mostrar a tela para o paciente escanear. */
  :root{ --cipreste:#33421F; --terracota:#E07A3F; --pergaminho:#F6EFE2; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{ background:#33421F; display:flex; align-items:center; justify-content:center; }
  .screen{
    width:min(100vw, calc(100vh * 9 / 16)); aspect-ratio:9/16; max-height:100vh;
    background:var(--pergaminho);
    background-image:radial-gradient(circle at 0% 0%, #5F7A3524, transparent 45%), radial-gradient(circle at 100% 100%, #E07A3F22, transparent 45%);
    display:flex; flex-direction:column; align-items:center; justify-content:space-between; text-align:center;
    padding:15% 9% 17%;
    font-size:min(1vw, calc(100vh * 9 / 1600));
  }
  .logo{ width:72%; height:auto; }
  .qr-box{ width:84%; background:#fff; border-radius:5em; padding:5em; box-shadow:0 0 0 .5em #5F7A3540, 0 3em 8em rgba(51,66,31,.12); position:relative; }
  .qr{ display:block; width:100%; height:auto; }
  .qr-center{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:21%; aspect-ratio:1; border-radius:50%; background:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .qr-center img{ width:78%; height:auto; }
  .cta{ font-family:"Playfair Display", Georgia, serif; font-weight:500; font-size:9em; line-height:1.1; color:var(--cipreste); margin:0; }
  .cta em{ color:var(--terracota); }
</style>
